<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تغيير كلمة المرور</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f8f9fa;
            direction: rtl;
            text-align: right;
        }
        .box {
            background: white;
            padding: 25px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            width: 450px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand text-white" href="/">الرئيسية</a>
    <div>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">الإحصائيات</a>
        <a href="/log" class="btn btn-outline-light btn-sm">السجل</a>
        <a href="/upload" class="btn btn-outline-light btn-sm">رفع CSV</a>
        <a href="/change_password" class="btn btn-outline-light btn-sm">تغيير كلمة المرور</a>
        <a href="/logout" class="btn btn-danger btn-sm">تسجيل الخروج</a>
    </div>
</nav>

<div class="container d-flex justify-content-center">
    <div class="box">
        <h3 class="text-center mb-4">تغيير كلمة المرور</h3>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <form method="POST">
            <label class="form-label">كلمة المرور القديمة:</label>
            <input type="password" name="old_password" class="form-control" required>

            <label class="form-label mt-3">كلمة المرور الجديدة:</label>
            <input type="password" name="new_password" class="form-control" required>

            <button class="btn btn-primary w-100 mt-4">تغيير كلمة المرور</button>
        </form>
    </div>
</div>

</body>
</html>
