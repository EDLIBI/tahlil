<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تعديل مستخدم</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; direction: rtl; text-align: right; }
        .box { background: white; padding: 25px; margin-top: 50px; border-radius: 10px; box-shadow: 0 0 10px #ccc; width: 450px; }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center">
    <div class="box">
        <h3 class="text-center mb-4">تعديل المستخدم</h3>

        <form method="POST">
            <label>اسم المستخدم:</label>
            <input type="text" name="username" class="form-control" value="{{ user.username }}" required>

            <label class="mt-3">كلمة المرور:</label>
            <input type="text" name="password" class="form-control" value="{{ user.password }}" required>

            <label class="mt-3">الصلاحية:</label>
            <select name="role" class="form-control">
                <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>مدير</option>
                <option value="user" {% if user.role == 'user' %}selected{% endif %}>مستخدم</option>
            </select>

            <button class="btn btn-primary w-100 mt-4">حفظ التعديلات</button>
        </form>
    </div>
</div>

</body>
</html>
