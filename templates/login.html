<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f0f2f5; direction: rtl; text-align: right; }
        .box { background: white; padding: 25px; margin-top: 80px; border-radius: 10px; box-shadow: 0 0 10px #ccc; width: 400px; }
    </style>
</head>

<body>
<div class="container d-flex justify-content-center">
    <div class="box">
        <h3 class="text-center mb-4">تسجيل الدخول</h3>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label>اسم المستخدم:</label>
            <input type="text" name="username" class="form-control" required>

            <label class="mt-3">كلمة المرور:</label>
            <input type="password" name="password" class="form-control" required>

            <button class="btn btn-primary w-100 mt-4">دخول</button>
        </form>

        <a href="/register" class="btn btn-link mt-3">إنشاء حساب جديد</a>
    </div>
</div>
</body>
</html>
