<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>رفع ملف CSV</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; direction: rtl; text-align: right; }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand text-white" href="/">الرئيسية</a>
    <div>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">الإحصائيات</a>
        <a href="/log" class="btn btn-outline-light btn-sm">السجل</a>
        <a href="/upload" class="btn btn-outline-light btn-sm">رفع CSV</a>
        <a href="/change_password" class="btn btn-outline-light btn-sm">تغيير كلمة المرور</a>
        <a href="/logout" class="btn btn-danger btn-sm">تسجيل الخروج</a>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">رفع ملف CSV وتحليل الأخبار</h2>

    <form method="POST" enctype="multipart/form-data">
        <label>اختر ملف CSV:</label>
        <input type="file" name="file" class="form-control" required>

        <button class="btn btn-primary mt-3">رفع وتحليل</button>
    </form>

    {% if results %}
    <h4 class="mt-4">نتائج التحليل:</h4>
    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>النص</th>
                <th>النتيجة</th>
            </tr>
        </thead>
        <tbody>
        {% for item in results %}
            <tr>
                <td>{{ item.text }}</td>
                <td>{{ item.result }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% endif %}
</div>

</body>
</html>
