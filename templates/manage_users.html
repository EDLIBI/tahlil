<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إدارة المستخدمين</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; direction: rtl; text-align: right; }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand text-white" href="/">الرئيسية</a>
    <div>
        <a href="/manage_users" class="btn btn-outline-light btn-sm">إدارة المستخدمين</a>
        <a href="/logout" class="btn btn-danger btn-sm">تسجيل الخروج</a>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">إدارة المستخدمين</h2>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>اسم المستخدم</th>
                <th>الصلاحية</th>
                <th>تعديل</th>
                <th>حذف</th>
            </tr>
        </thead>
        <tbody>
        {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.role }}</td>
                <td><a href="/edit_user/{{ user.id }}" class="btn btn-warning btn-sm">تعديل</a></td>
                <td><a href="/delete_user/{{ user.id }}" class="btn btn-danger btn-sm">حذف</a></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
