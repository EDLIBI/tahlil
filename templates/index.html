<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>كشف الأخبار الكاذبة</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; direction: rtl; text-align: right; }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand text-white" href="/">الرئيسية</a>
    <div>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">الإحصائيات</a>
        <a href="/log" class="btn btn-outline-light btn-sm">السجل</a>
        <a href="/upload" class="btn btn-outline-light btn-sm">رفع CSV</a>
        <a href="/change_password" class="btn btn-outline-light btn-sm">تغيير كلمة المرور</a>
        <a href="/logout" class="btn btn-danger btn-sm">تسجيل الخروج</a>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">كشف الأخبار الكاذبة – تحليل الخبر</h2>

    <form method="POST">
        <label>أدخل الخبر:</label>
        <textarea name="news" class="form-control" rows="4"></textarea>

        <button class="btn btn-primary mt-3">تحليل الخبر</button>
    </form>

    {% if result %}
    <div class="alert alert-info mt-3">{{ result }}</div>
    {% endif %}
</div>

</body>
</html>
